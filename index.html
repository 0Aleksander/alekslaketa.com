<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aleksander Laketa</title>
<meta name="description" content="Aleksander Laketa — I build infrastructure that ships.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

<style>
  :root {
    --bg: #051712;
    --text: #ffffff;
    --accent: #EFB94A;
    --muted: #7c8a8a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Avenir Next", "Myriad Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 8vh 6vw;
    position: relative;
    overflow-x: hidden;
  }

  /* subtle diagonal gradient within the same green family — texture, not a new hue */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #08211a 0%, #051712 45%, #030d0a 100%);
    z-index: -2;
  }

  /* oversized monogram watermark, no border/background of its own */
  .watermark {
    position: fixed;
    top: 50%;
    right: -8vw;
    width: min(70vh, 900px);
    height: min(70vh, 900px);
    color: var(--text);
    opacity: 0.05;
    transform: translateY(-50%);
    pointer-events: none;
    z-index: -1;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 640px;
    opacity: 0;
    transform: translateY(12px);
    animation: rise 0.9s ease-out forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .photo-frame {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 32px;
    border: 2px solid var(--accent);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    background: var(--bg);
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform: scale(1.15);
    transform-origin: 50% 35%;
    -webkit-mask-image: radial-gradient(circle, black 58%, black 68%, transparent 94%);
    mask-image: radial-gradient(circle, black 58%, black 68%, transparent 94%);
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 14px;
    font-weight: 600;
  }

  h1 {
    font-size: clamp(2.2rem, 5.5vw, 3.4rem);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 18px;
  }

  .slogan {
    font-size: clamp(1.25rem, 3vw, 1.6rem);
    font-weight: 600;
    color: var(--accent);
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }

  .subline {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 40px;
    max-width: 460px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 0 0 44px;
  }

  .tag {
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    color: var(--muted);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    padding: 7px 16px;
    transition: border-color 0.25s ease, color 0.25s ease;
  }

  .tag:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  .divider {
    width: 40px;
    height: 2px;
    background: var(--accent);
    border: none;
    margin: 0 0 40px;
    opacity: 0.9;
  }

  .links {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: var(--text);
    transition: border-color 0.25s ease, color 0.25s ease, transform 0.25s ease;
  }

  .link svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
  }

  .link:hover {
    color: var(--accent);
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  footer {
    position: absolute;
    bottom: 5vh;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    color: var(--muted);
    opacity: 0.6;
  }

  @media (max-width: 480px) {
    .links { gap: 20px; }
    .watermark { opacity: 0.04; }
  }
</style>
</head>
